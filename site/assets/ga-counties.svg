<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 420" role="img" aria-label="Georgia school districts by composite score">
  <title>Georgia · leaders and laggards by district</title>
  <defs>
    <style>
      .ga-base { fill: #161b22; stroke: #30363d; stroke-width: 1.2; }
