      .c-mid { fill: #4a5d78; stroke: #6b7f9a; stroke-width: 0.6; cursor: pointer; }
      .c-lag { fill: #c45c7a; stroke: #e08aa3; stroke-width: 0.5; cursor: pointer; }
      .c-muted { fill: #1c2330; stroke: #2a3342; stroke-width: 0.4; }
      .lbl { fill: #e6edf3; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 7.5px; font-weight: 700; letter-spacing: 0.04em; pointer-events: none; }
      .dot-city { stroke: #0d1117; stroke-width: 1; cursor: pointer; }
    </style>
  </defs>
  <!-- Stylized Georgia silhouette -->
